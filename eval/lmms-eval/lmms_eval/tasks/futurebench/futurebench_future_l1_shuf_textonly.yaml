dataset_path: ${DATA_ROOT}/extra/futurebench/hf_shuffled
dataset_kwargs:
  load_from_disk: True
  cache_dir: ${DATA_ROOT}/extra/v1_33k/first_part_video/

task: futurebench_future_l1_shuf_textonly  # options shuffled, answer position balanced (dataset/make_futurebench_shuffled.py)
test_split: test
output_type: generate_until
doc_to_visual: !function utils.future_pred_doc_to_visual_none  # text-only ablation: no video
doc_to_text: !function utils.future_pred_doc_to_text
doc_to_target: !function utils.future_pred_doc_to_target

generation_kwargs:
  max_new_tokens: 2048
  temperature: 0
  top_p: 1
  do_sample: false
  
process_results: !function utils.future_pred_process_reasoning_results

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Please provide only the single option letter within the <answer> </answer> tags."
    
metric_list:
  - metric: future_acc
    aggregation: !function utils.future_pred_aggregate_results
    higher_is_better: true
  - metric: hop1_acc
    aggregation: !function utils.future_pred_aggregate_hop1
    higher_is_better: true
  - metric: hop2_acc
    aggregation: !function utils.future_pred_aggregate_hop2
    higher_is_better: true
  - metric: hop3_acc
    aggregation: !function utils.future_pred_aggregate_hop3
    higher_is_better: true
  - metric: hop5_acc
    aggregation: !function utils.future_pred_aggregate_hop5
    higher_is_better: true

metadata:
  - version: 0.0
