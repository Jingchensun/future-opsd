dataset_path: ${DATA_ROOT}/extra/futureomni/hf
dataset_kwargs:
  load_from_disk: True
task: futureomni
test_split: test
output_type: generate_until
doc_to_visual: !function utils.futureomni_doc_to_visual
doc_to_text: !function utils.futureomni_doc_to_text
doc_to_target: answer
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.futureomni_process_results
metric_list:
  - metric: futureomni_acc
    aggregation: !function utils.futureomni_aggregate
    higher_is_better: true
metadata:
  - version: 0.0
